<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Subtle shine overlay -->
  <rect width="128" height="128" rx="28" fill="url(#shine)"/>
  <!-- Chat bubble / prompt icon -->
  <g transform="translate(64,58)">
    <!-- Main bubble -->
    <rect x="-28" y="-24" width="56" height="40" rx="10" fill="white" opacity="0.95"/>
    <!-- Bubble tail -->
    <polygon points="-8,16 0,28 4,16" fill="white" opacity="0.95"/>
    <!-- Cursor line -->
    <rect x="-14" y="-12" width="3" height="18" rx="1.5" fill="#6366f1"/>
    <!-- Text lines -->
    <rect x="-4" y="-10" width="20" height="3" rx="1.5" fill="#c7d2fe"/>
    <rect x="-4" y="-3" width="14" height="3" rx="1.5" fill="#c7d2fe"/>
    <rect x="-4" y="4" width="18" height="3" rx="1.5" fill="#c7d2fe"/>
  </g>
  <!-- Sparkle dots -->
  <circle cx="98" cy="22" r="3" fill="white" opacity="0.6"/>
  <circle cx="106" cy="30" r="2" fill="white" opacity="0.4"/>
  <circle cx="22" cy="106" r="2.5" fill="white" opacity="0.5"/>
</svg>
